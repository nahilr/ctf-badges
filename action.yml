name: 'Security Profile Badges'
description: 'Render live TryHackMe and Hack The Box profile badges and commit them to your repo'
branding:
  icon: 'award'
  color: 'red'

inputs:
  thm_username:
    description: 'TryHackMe username'
    required: true
  htb_profile_id:
    description: 'Hack The Box numeric profile id (the number in app.hackthebox.com/users/<id>)'
    required: true
  thm_image_path:
    description: 'Path where the TryHackMe badge SVG is saved'
    required: false
    default: 'assets/thm_badge.svg'
  htb_image_path:
    description: 'Path where the Hack The Box badge SVG is saved'
    required: false
    default: 'assets/htb_badge.svg'
  committer_username:
    description: 'Git username for the commit'
    required: false
    default: 'github-actions[bot]'
  committer_email:
    description: 'Git email for the commit'
    required: false
    default: '41898282+github-actions[bot]@users.noreply.github.com'
  commit_message:
    description: 'Commit message'
    required: false
    default: 'chore: update profile badges'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: pip install -r "${{ github.action_path }}/requirements.txt"

    - name: Render TryHackMe badge
      shell: bash
      env:
        THM_USERNAME: ${{ inputs.thm_username }}
        IMAGE_PATH: ${{ inputs.thm_image_path }}
      run: python3 "${{ github.action_path }}/thm/badge.py" "$THM_USERNAME" -o "$IMAGE_PATH"

    - name: Render Hack The Box badge
      shell: bash
      env:
        HTB_PROFILE_ID: ${{ inputs.htb_profile_id }}
        IMAGE_PATH: ${{ inputs.htb_image_path }}
      run: python3 "${{ github.action_path }}/htb/badge.py" "$HTB_PROFILE_ID" -o "$IMAGE_PATH"

    - name: Commit and push
      shell: bash
      env:
        COMMITTER_USERNAME: ${{ inputs.committer_username }}
        COMMITTER_EMAIL: ${{ inputs.committer_email }}
        COMMIT_MESSAGE: ${{ inputs.commit_message }}
        THM_IMAGE_PATH: ${{ inputs.thm_image_path }}
        HTB_IMAGE_PATH: ${{ inputs.htb_image_path }}
      run: |
        git config user.name "$COMMITTER_USERNAME"
        git config user.email "$COMMITTER_EMAIL"
        if git diff --quiet -- "$THM_IMAGE_PATH" "$HTB_IMAGE_PATH" \
          && git ls-files --error-unmatch -- "$THM_IMAGE_PATH" "$HTB_IMAGE_PATH" >/dev/null 2>&1; then
          echo "Badges unchanged, skipping commit."
          exit 0
        fi
        git add "$THM_IMAGE_PATH" "$HTB_IMAGE_PATH"
        git commit -m "$COMMIT_MESSAGE"
        git push
