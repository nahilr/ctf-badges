name: Profile Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update TryHackMe and Hack The Box badges
        uses: nahilr/ctf-badges@main
        with:
          thm_username: "<YOUR_THM_USERNAME>"
          htb_profile_id: "<YOUR_HTB_PROFILE_ID>"
